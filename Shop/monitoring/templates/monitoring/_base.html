<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Мониторинг бэкапов{% endblock %} — Лаборатория ВТ</title>
  <style>
    :root {
      --bg: #f4f6f8; --card: #fff; --text: #1d2733; --muted: #6b7785; --line: #e1e6eb;
      --ok: #1f8a4c; --ok-bg: #e6f5ec; --warn: #9a6700; --warn-bg: #fff4d6;
      --err: #c0392b; --err-bg: #fde8e6; --miss: #5b5f97; --miss-bg: #ecedf8; --link: #1f6feb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11161c; --card: #1a2129; --text: #e3e8ee; --muted: #8b97a5; --line: #2a333d;
        --ok: #5fd08f; --ok-bg: #16301f; --warn: #f0c050; --warn-bg: #3a2f10;
        --err: #ff7b6e; --err-bg: #3d1a17; --miss: #a9adf0; --miss-bg: #25274a; --link: #6ea8fe;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    h1 { font-size: 22px; margin: 8px 0 16px; }
    h2 { font-size: 17px; margin: 28px 0 10px; }
    .muted { color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin-bottom: 12px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 8px; }
    .tile { border-radius: 10px; padding: 10px 14px; border: 1px solid var(--line); background: var(--card); }
    .tile b { display: block; font-size: 26px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
    tr:last-child td { border-bottom: 0; }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .s-ok { color: var(--ok); background: var(--ok-bg); }
    .s-warning { color: var(--warn); background: var(--warn-bg); }
    .s-error { color: var(--err); background: var(--err-bg); }
    .s-missing { color: var(--miss); background: var(--miss-bg); }
    .host { font-weight: 600; margin: 10px 0 4px; }
    .msg { max-width: 520px; white-space: pre-wrap; word-break: break-word; }
    form.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
    select, button { font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line);
                     background: var(--card); color: var(--text); }
    .pager { display: flex; gap: 12px; margin-top: 10px; }
    details summary { cursor: pointer; color: var(--link); }
    pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; margin: 6px 0 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>{% block heading %}Мониторинг бэкапов{% endblock %}</h1>
      <span class="muted"><a href="{% url 'monitoring:dashboard' %}">Сводка</a> · <a href="/admin/monitoring/">Настройка в админке</a></span>
    </header>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
