# Временный HTTP-only конфиг для ПЕРВОГО запуска и выпуска сертификата.
# Работает без сертификата: отдаёт сайт по HTTP и пропускает ACME-проверку.
# После выпуска сертификата заменяется на highlab.conf (см. DEPLOY.md).
server {
    listen 80;
    listen [::]:80;
    server_name xn----7sbadh8ar0abscwf3p.xn--p1ai www.xn----7sbadh8ar0abscwf3p.xn--p1ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ { alias /app/staticfiles/; }
    location /media/  { alias /app/media/; }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
