# nginx для Лаборатории ВТ — HTTP→HTTPS + прокси на gunicorn, отдача статики/медиа.
# Домен (punycode для лаборатория-вт.рф): xn----7sbadh8ar0abscwf3p.xn--p1ai
upstream django_app {
    server web:8000;
}

# HTTP: пропускаем ACME-проверку Let's Encrypt, остальное — на HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name xn----7sbadh8ar0abscwf3p.xn--p1ai www.xn----7sbadh8ar0abscwf3p.xn--p1ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: основной сервер.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xn----7sbadh8ar0abscwf3p.xn--p1ai www.xn----7sbadh8ar0abscwf3p.xn--p1ai;

    ssl_certificate     /etc/letsencrypt/live/xn----7sbadh8ar0abscwf3p.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn----7sbadh8ar0abscwf3p.xn--p1ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25m;

    # ACME-проверка доступна и по HTTPS (на всякий случай).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Статика и медиа — отдаёт сам nginx (быстрее, не грузит gunicorn).
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }
    location /media/ {
        alias /app/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
