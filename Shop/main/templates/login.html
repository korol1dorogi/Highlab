{% extends 'shop.html' %}
{% block title %}Вход{% endblock %}

{% block content %}
<div class="container">
    <h2 class="mb-4">Вход</h2>
    <div class="row">
        <div class="col-md-6">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <input type="hidden" name="next" value="{{ next }}">
                <button type="submit" class="btn btn-primary">Войти</button>
            </form>
            <p class="mt-3">Нет аккаунта? <a href="{% url 'shop:signup' %}">Зарегистрироваться</a></p>
        </div>
    </div>
</div>
{% endblock %}
