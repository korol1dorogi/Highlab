{% extends 'shop.html' %}
{% block title %}Смена пароля{% endblock %}

{% block content %}
<div class="container">
    <h2 class="mb-4">Смена пароля</h2>
    <div class="row">
        <div class="col-md-6">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Сменить пароль</button>
                <a href="{% url 'shop:profile' %}" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
