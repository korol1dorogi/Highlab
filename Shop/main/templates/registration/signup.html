{% extends 'shop.html' %}
{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="container">
    <h2 class="mb-4">Регистрация</h2>
    <div class="row">
        <div class="col-md-6">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
            </form>
            <p class="mt-3">Уже есть аккаунт? <a href="{% url 'shop:login' %}">Войти</a></p>
        </div>
    </div>
</div>
{% endblock %}
