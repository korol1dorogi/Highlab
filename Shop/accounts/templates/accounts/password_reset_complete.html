{% extends 'base.html' %}

{% block title %}Пароль изменён — {{ site_settings.company_name }}{% endblock %}
{% block robots %}noindex, nofollow{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <div class="auth-card card">
            <h1 class="auth-card__title">Пароль изменён</h1>
            <p class="auth-card__sub">Готово! Теперь войдите с новым паролем.</p>
            <a href="{% url 'accounts:login' %}" class="btn btn--primary btn--lg auth-submit">Войти</a>
        </div>
    </div>
</section>
{% endblock %}
