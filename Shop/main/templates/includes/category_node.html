<!-- templates/includes/category_node.html -->
<div class="category-node mb-2">
    <div class="category-header d-flex justify-content-between align-items-center p-2 border rounded {% if current_category and current_category.id == category.id %}bg-primary text-white{% endif %}">
        <a href="{{ category.get_absolute_url }}" class="text-decoration-none flex-grow-1 {% if current_category and current_category.id == category.id %}text-white{% else %}text-dark{% endif %}">
            {{ category.name }}
            <span class="badge {% if current_category and current_category.id == category.id %}bg-light text-dark{% else %}bg-secondary{% endif %} ms-1">
                {{ category.get_products_count }}
            </span>
        </a>
        {% if not category.is_leaf_node %}
        <button class="btn btn-sm {% if current_category and current_category.id == category.id %}btn-light{% else %}btn-outline-secondary{% endif %} toggle-subcategories ms-2 collapsed" 
                type="button"
                data-bs-toggle="collapse" 
                data-bs-target="#subcategories-{{ category.id }}"
                aria-expanded="false"
                aria-controls="subcategories-{{ category.id }}">
            <i class="bi bi-chevron-down"></i>
        </button>
        {% endif %}
    </div>
    
    {% if not category.is_leaf_node %}
    <div class="subcategories collapse mt-2" id="subcategories-{{ category.id }}">
        {% for child in category.get_children %}
        <div class="ps-3">
            {% include 'includes/category_node.html' with category=child %}
        </div>
        {% endfor %}
    </div>
    {% endif %}
</div>
