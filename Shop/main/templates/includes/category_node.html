<!-- templates/includes/category_node.html -->
<div class="cat-node">
    <div class="cat-row {% if current_category and current_category.id == category.id %}is-active{% endif %}">
        <a href="{{ category.get_absolute_url }}" class="cat-row__name">{{ category.name }}</a>
        <span class="cat-row__count">{{ category.get_products_count }}</span>
        {% if not category.is_leaf_node %}
        <button class="cat-row__toggle collapsed" type="button"
                data-bs-toggle="collapse" data-bs-target="#sub-{{ category.id }}"
                aria-expanded="false" aria-controls="sub-{{ category.id }}" aria-label="Развернуть">
            <i class="bi bi-chevron-down"></i>
        </button>
        {% endif %}
    </div>

    {% if not category.is_leaf_node %}
    <div class="cat-sub collapse" id="sub-{{ category.id }}">
        {% for child in category.get_children %}
            {% include 'includes/category_node.html' with category=child %}
        {% endfor %}
    </div>
    {% endif %}
</div>
